# Builds the Android app from this repository's source and publishes it with a SHA-256 checksum,
# so anyone can check that a released APK came from this code.
#
# - Push a tag like `android-v1.2.0` to build and attach `fretlark-android.apk` and
#   `fretlark-android.apk.sha256` to the release of that name (created if it does not exist).
# - Run it by hand (Actions → Android app → Run workflow) to get the APK as a workflow artifact.
# - Signing: add the secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS
#   and ANDROID_KEY_PASSWORD so updates install over older versions. Without them the APK is signed
#   with a throwaway key: fine to try out, but it will not update an installed copy.
name: Android app

on:
  workflow_dispatch:
  push:
    tags: ['android-v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/fretlark.jks"
            echo "FRETLARK_KEYSTORE=$RUNNER_TEMP/fretlark.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets: this APK uses a throwaway key and will not update an installed copy."
          fi

      - name: Build
        working-directory: android
        env:
          FRETLARK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FRETLARK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FRETLARK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FRETLARK_VERSION_CODE: ${{ github.run_number }}
        run: |
          ./gradlew --no-daemon assembleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/fretlark-android.apk
          (cd out && sha256sum fretlark-android.apk > fretlark-android.apk.sha256 && cat fretlark-android.apk.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: fretlark-android
          path: android/out/fretlark-android.apk*
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" \
            --title "Fretlark Android ${GITHUB_REF_NAME#android-v}" \
            --notes "Built from \`$GITHUB_SHA\` by this workflow. Check the download with \`sha256sum -c fretlark-android.apk.sha256\`."
          gh release upload "$GITHUB_REF_NAME" android/out/fretlark-android.apk android/out/fretlark-android.apk.sha256 --clobber
