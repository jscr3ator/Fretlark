<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="/favicon.svg?v=4">
  <meta name="color-scheme" content="light">
  <title>Shared song — Fretlark</title>
  <link rel="stylesheet" href="/player.css?v=05d6f17eb683">
</head>
<body class="viewer simple-player">
<div class="viewer-content">
<header class="player-header">
  <div class="player-brand"><img id="player-cover" src="/admin-assets/brand.svg?v=4" alt="Fretlark" width="28" height="28"><span id="lesson-badge" hidden>Shared song</span></div>
  <div class="song-caption"><strong id="tab-file-title">Opening song…</strong><span id="player-artist"></span></div>
  <div class="header-actions">
    <a id="back-library" href="/admin" hidden aria-label="Back to songs"><svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg><span>Library</span></a>
    <button type="button" id="btn-print" class="quiet-button" aria-label="Print / PDF" title="Print / PDF"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8V3h12v5M6 18H4a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-2M6 14h12v7H6z"/><path d="M18 11h.01"/></svg><span>Print</span></button>
    <button type="button" id="btn-download" class="quiet-button" aria-label="Download file" title="Download file"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-8 4-4 4 4M4 14v7h16v-7"/></svg><span>Download</span></button>
    <button type="button" id="toggle-hand-guide" class="quiet-button" aria-label="Fingering" aria-controls="hand-guide" aria-expanded="false" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M8 6v12m5-12v12m5-12v12M3 10h18M3 14h18"/></svg><span>Fingering</span></button>
  </div>
</header>
<section class="practice-toolbar" aria-label="Practice tools">
  <div class="practice-toolbar-inner">
    <div class="tool-group">
      <label class="tempo-field"><span>Tempo</span><input id="tempo-input" type="number" min="20" max="400" step=".1" value="120" aria-label="Playback tempo in BPM"><small>BPM</small></label>
      <button id="btn-metronome" title="Click on every beat during playback" type="button" class="tool-button" aria-pressed="false"><span class="tool-indicator" aria-hidden="true"></span>Metronome <span class="practice-toggle-state">Off</span></button>
      <button id="btn-count-in" title="One bar of clicks before playback starts" type="button" class="tool-button" aria-pressed="false"><span class="tool-indicator" aria-hidden="true"></span>Count-in <span class="practice-toggle-state">Off</span></button>
    </div>
    <div class="tool-group tool-group-end">
      <label class="notation-control"><span>Notation</span><select id="notation-select" aria-label="Notation"><option value="both" selected>Tabs + notes</option><option value="tab">Tablature</option><option value="standard">Standard</option><option value="slash">Rhythm slashes</option><option value="numbered">Numbered</option></select></label>
      <label class="tool-zoom"><span>Zoom</span><select id="zoom-select" aria-label="Zoom"><option value="fit" selected>Fit width</option><option value=".75">75%</option><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option></select></label>
      <button id="open-mixer" type="button" class="settings-action" aria-label="Track mix" popovertarget="track-mix-panel" aria-controls="track-mix-panel" aria-expanded="false" data-student-mixer><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10m4 0h2M4 17h4m4 0h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Track mix</span></button>
      <button id="btn-fullscreen" type="button" class="settings-action icon-only" aria-label="Fullscreen" title="Fullscreen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg><span class="button-label sr-only">Fullscreen</span></button>
    </div>
  </div>
</section>
  <aside class="hand-guide" id="hand-guide" aria-labelledby="hand-title" hidden>
    <div class="hand-heading"><h2 id="hand-title">Fingering</h2><span id="hand-status" class="hand-chip" title="Finger numbers come from the file when written; otherwise they are suggested from the surrounding notes."></span><span id="hand-chord" class="hand-chip hand-chord" hidden></span><span id="hand-caption" class="hand-chip" hidden></span>
      <button type="button" id="close-hand-guide" aria-label="Close fingering guide">×</button></div>
    <div id="hand-board"></div>
    <p id="hand-detail" class="sr-only"></p>
  </aside>
<main class="player-stage">
  <div class="score-scroll" id="score-scroll"><div class="score-page" id="score-page"><div id="alphatab" aria-label="Song notation and tablature"></div><div id="score-empty-hint" class="empty-hint" hidden><strong>Opening your song…</strong></div></div></div>
  <div class="loading-overlay" id="loading-overlay"><span class="spinner"></span><strong>Opening your song</strong><span>Preparing notation and instruments…</span></div>
</main>
</div>
<section class="practice-bar" aria-label="Playback controls">
  <div class="transport-row">
    <div class="transport-main">
      <button id="btn-stop" class="restart-button" type="button" aria-label="Restart song" title="Restart song"><svg viewBox="0 0 24 24"><path d="M6 5v14m13-14L8 12l11 7z"/></svg></button>
      <button id="btn-play" class="play-button" type="button" disabled aria-label="Play"><svg viewBox="0 0 24 24" class="play-symbol"><path d="m8 5 11 7-11 7z" fill="currentColor" stroke="none"/></svg><svg viewBox="0 0 24 24" class="pause-symbol"><path d="M8 5v14M16 5v14" stroke-width="4"/></svg></button>
    </div>
    <div class="playback-progress"><span id="time-position">0:00</span><input id="seek-position" type="range" min="0" max="1000" value="0" step="1" aria-label="Playback position"><span id="time-total">0:00</span><span id="playback-bar-position" aria-label="Bar 1">1</span></div>
    <div class="practice-controls">
      <label class="track-control"><span class="control-label">Track</span><select id="active-track-select" aria-label="Track to practise"></select></label>
      <label class="speed-control"><span class="control-label">Speed</span><select id="speed-select" aria-label="Playback speed"><option value=".25">25%</option><option value=".5">50%</option><option value=".6">60%</option><option value=".7">70%</option><option value=".75">75%</option><option value=".8">80%</option><option value=".9">90%</option><option value="1" selected>100%</option><option value="1.25">125%</option><option value="1.5">150%</option></select></label>
      <div class="repeat-wrap">
        <button id="btn-loop" class="repeat-button" type="button" aria-label="Repeat section" aria-pressed="false" aria-expanded="false" aria-controls="repeat-range"><svg viewBox="0 0 24 24"><path d="M20 7H7a4 4 0 0 0-4 4v1m17-5-4-4m4 4-4 4M4 17h13a4 4 0 0 0 4-4v-1M4 17l4 4m-4-4 4-4"/></svg><span>Repeat</span></button>
        <button id="edit-repeat-range" type="button" class="repeat-edit" aria-label="Change repeat bars" aria-haspopup="true" hidden>1–1</button>
        <div id="repeat-range" class="repeat-range" hidden>
          <div class="range-heading"><strong>Repeat</strong><button id="close-range" type="button" aria-label="Close repeat range">×</button></div>
          <div class="range-fields"><label>From bar<input id="loop-start" type="number" min="1" value="1" aria-label="Loop start measure"></label><span>–</span><label>To bar<input id="loop-end" type="number" min="1" value="1" aria-label="Loop end measure"></label></div>
          <div class="range-actions"><button id="loop-current" type="button">Current bar</button><button id="loop-full" type="button">Full song</button></div>
          <label class="trainer-toggle"><input id="speed-trainer" type="checkbox"><span><strong>Speed trainer</strong><small>Start slow and add 5% each time the section repeats, up to full speed.</small></span></label>
        </div>
      </div>
    </div>
  </div>
</section>
<aside id="track-mix-panel" class="mix-panel settings-panel" popover aria-labelledby="mix-title" data-student-mixer>
  <div class="panel-heading"><h2 id="mix-title">Track mix</h2><button type="button" class="close-dialog" popovertarget="track-mix-panel" popovertargetaction="hide" aria-label="Close track mix">×</button></div>
  <label class="volume-setting">Master volume<input id="master-volume" type="range" min="0" max="100" value="75" aria-label="Master volume"></label>
  <div class="mix-column-labels"><span>Tabs · Track</span><span>Volume · 100% = original</span></div>
  <div id="track-list" aria-label="Track mix"></div>
</aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div><span id="score-status" hidden></span><span class="status-help" hidden></span><span class="dock-status" hidden></span><input id="editor-mode" type="checkbox" hidden>
<div id="metro-pop" class="volume-pop" role="group" aria-label="Metronome volume" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9zm12.5 1.5a3.5 3.5 0 0 1 0 5"/></svg><input id="metro-volume" type="range" min="1" max="100" step="1" value="60" aria-label="Metronome volume"><output id="metro-volume-value">60</output></div>
<script src="./vendor/alphaTab.js?v=ac899d4f853a"></script><script src="./vendor/fflate.js?v=c3b34f2e9f5e"></script><script src="./model.js?v=636357f054c2"></script><script src="./app.js?v=f659334b38fe"></script><script src="./hand-position.js?v=49960e5c5c7b"></script><script src="/player.js?v=7f390fee069a"></script>
</body></html>
