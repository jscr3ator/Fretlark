<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.svg?v=4">
  <title>Setlist — Fretlark</title>
  <script>try{var t=localStorage.getItem("fretphrase-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="/set.css?v=0b940cc52dcf">
</head>
<body>
  <header class="set-header">
    <div class="set-heading">
      <a class="set-brand" href="/" aria-label="Fretlark"><i class="brand-mark" aria-hidden="true"></i><span>Fretlark</span></a>
      <h1 id="set-title">Setlist</h1>
      <p id="set-notes" class="set-notes" hidden></p>
    </div>
    <div class="set-nav">
      <span id="set-position" class="set-position" aria-live="polite"></span>
      <div class="set-nav-buttons">
        <button id="set-prev" class="set-nav-button" type="button" aria-label="Previous song" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 5-7 7 7 7"/></svg></button>
        <button id="set-next" class="set-nav-button" type="button" aria-label="Next song" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 5 7 7-7 7"/></svg></button>
      </div>
    </div>
  </header>
  <main class="set-main">
    <details id="set-list" class="set-list" open>
      <summary><span>Songs</span><span id="set-list-count" class="set-list-count"></span></summary>
      <div id="set-songs" class="set-songs"></div>
    </details>
    <section class="set-stage" aria-label="Song player">
      <iframe id="set-player" title="Song player" allow="fullscreen" hidden></iframe>
      <div id="set-empty" class="set-empty" hidden>
        <span class="set-empty-art" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg></span>
        <h2 id="set-empty-title">No songs in this setlist are available right now.</h2>
        <p id="set-empty-detail">The owner may have turned off the links to these songs.</p>
      </div>
      <div id="set-loading" class="set-loading"><span class="spinner" aria-hidden="true"></span><p>Loading setlist…</p></div>
    </section>
  </main>
  <script src="/set.js?v=344dc1dff151" defer></script>
</body>
</html>
