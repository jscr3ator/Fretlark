<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.svg?v=4">
  <title>Setlist — Fretlark</title>
  <script>try{var t=localStorage.getItem("fretphrase-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="/set.css?v=7dcb97ea075a">
</head>
<body>
  <div class="set-app">
    <header class="set-bar">
      <button id="set-open" class="set-bar-open" type="button" aria-haspopup="dialog" aria-controls="set-list" aria-expanded="false">
        <span id="set-bar-title" class="set-bar-title">Setlist</span>
        <span class="set-bar-pill"><svg class="pill-list" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg><span>All songs</span><span class="set-bar-count" data-pos-short></span><svg class="pill-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg></span>
      </button>
      <div id="set-hint" class="set-hint" role="status" hidden>Tap to see every song</div>
      <div class="set-nav-buttons">
        <button class="set-nav-button" type="button" data-nav="-1" aria-label="Previous song" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 5-7 7 7 7"/></svg></button>
        <button class="set-nav-button" type="button" data-nav="1" aria-label="Next song" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 5 7 7-7 7"/></svg></button>
      </div>
    </header>

    <nav class="set-rail" aria-label="Setlist controls">
      <button id="set-expand" class="set-icon-button" type="button" aria-label="Show song list" aria-controls="set-list"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M9.5 4.5v15"/></svg></button>
      <button class="set-nav-button" type="button" data-nav="-1" aria-label="Previous song" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 5-7 7 7 7"/></svg></button>
      <span class="set-rail-pos" data-pos-short></span>
      <button class="set-nav-button" type="button" data-nav="1" aria-label="Next song" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 5 7 7-7 7"/></svg></button>
    </nav>

    <aside id="set-list" class="set-side" aria-label="Setlist">
      <div class="set-side-head">
        <a class="set-brand" href="/" aria-label="Fretlark"><i class="brand-mark" aria-hidden="true"></i><span>Fretlark</span></a>
        <button id="set-toggle" class="set-icon-button" type="button" aria-label="Hide song list" aria-controls="set-list" aria-expanded="true">
          <svg class="icon-collapse" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M9.5 4.5v15"/></svg>
          <svg class="icon-close" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="set-side-title">
        <h1 id="set-title">Setlist</h1>
        <p id="set-list-count" class="set-meta"></p>
        <p id="set-notes" class="set-notes" role="button" tabindex="0" aria-expanded="false" hidden></p>
      </div>
      <div id="set-songs" class="set-songs"></div>
      <div class="set-side-foot">
        <button id="set-prev" class="set-nav-button" type="button" data-nav="-1" aria-label="Previous song" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 5-7 7 7 7"/></svg></button>
        <span id="set-position" class="set-position" data-pos aria-live="polite"></span>
        <button id="set-next" class="set-nav-button" type="button" data-nav="1" aria-label="Next song" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 5 7 7-7 7"/></svg></button>
      </div>
    </aside>
    <div id="set-scrim" class="set-scrim"></div>

    <main class="set-stage" aria-label="Song player">
      <iframe id="set-player" title="Song player" allow="fullscreen" hidden></iframe>
      <div id="set-empty" class="set-empty" hidden>
        <span class="set-empty-art" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg></span>
        <h2 id="set-empty-title">No songs in this setlist are available right now.</h2>
        <p id="set-empty-detail">The owner may have turned off the links to these songs.</p>
      </div>
      <div id="set-loading" class="set-loading"><span class="spinner" aria-hidden="true"></span><p>Loading setlist…</p></div>
    </main>
  </div>
  <script src="/set.js?v=27c5def76d08" defer></script>
</body>
</html>
